# run_tests -> bronze -> silver -> gold. A failing task stops everything downstream.
resources:
  jobs:
    easymoney_pipeline:
      name: easymoney_pipeline
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: run_tests
          notebook_task:
            notebook_path: ../run_tests.ipynb
        - task_key: bronze
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: ../01_bronze_ingestion.ipynb
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../02_silver.ipynb
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../03_gold.ipynb
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
