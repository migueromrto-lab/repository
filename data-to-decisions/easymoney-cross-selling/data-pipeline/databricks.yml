# Databricks Asset Bundle for the easyMoney medallion pipeline.
# Deploy: databricks bundle deploy -t dev --var alert_email=<you@example.com>
# Run:    databricks bundle run easymoney_pipeline -t dev

bundle:
  name: easymoney_pipeline

include:
  - resources/*.yml

variables:
  alert_email:
    description: Address notified when a run fails

targets:
  dev:
    mode: development
    default: true
